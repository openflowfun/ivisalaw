name: Deploy preview to GitHub Pages

# Client preview only. Every build sets PUBLIC_PREVIEW=true, which emits
# noindex on all pages and a Disallow robots.txt — a pre-launch site carrying
# placeholder IAA licence numbers and unverified policy figures must never be
# indexed or mistaken for the live ivisalaw.co.nz site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds with PUBLIC_PREVIEW=true, then rewrites internal links and
      # assets to the /ivisalaw/ subpath Pages serves from, and writes
      # .nojekyll so Jekyll does not strip the /_astro/ directory.
      - run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
